# Weekly dependency updates, plus security updates as soon as an advisory is published.
# (Oct 2026: an internet-facing n8n server sat six months behind on security fixes.)
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch: {update-types: [minor, patch]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
