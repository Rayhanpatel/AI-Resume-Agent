name: Eval gate

# The golden eval asks the real model the questions recruiters ask most and checks
# what it must and must not say, then stamps every answer against the profile.
# It runs on every push to main and every pull request that touches the agent, and
# weekly. With Railway's "Wait for CI" on, a failing run stops the backend deploy, so a
# model, prompt or profile change can't ship a wrong answer (the frontend on Vercel is
# not gated by it). It signs in to Google with Workload Identity
# Federation (GitHub's OIDC token, no key file) as a service account that only has
# "Vertex AI User". Repository variables (identifiers, not secrets):
#   GCP_PROJECT          the project id
#   GCP_WIF_PROVIDER     projects/<number>/locations/global/workloadIdentityPools/github/providers/ai-resume-agent
#   GCP_SERVICE_ACCOUNT  golden-eval@<project>.iam.gserviceaccount.com
# Without them the job reports "skipped" instead of failing. Pull requests from forks
# get no OIDC token, so they can't reach the model.

on:
  push:
    branches: [main]
    paths:
      - "backend/core/**"
      - "backend/services/**"
      - "backend/evals/**"
  pull_request:
    paths:
      - "backend/core/**"
      - "backend/services/**"
      - "backend/evals/**"
  schedule:
    - cron: "41 14 * * 1"  # Mondays, 10:41 a.m. ET
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # lets the job request GitHub's OIDC token for Google

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Vertex credentials
        id: creds
        env:
          HAS_KEY: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT != '' }}
        run: echo "present=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Skip (no credentials)
        if: steps.creds.outputs.present != 'true'
        run: echo "::notice::GCP_WIF_PROVIDER / GCP_SERVICE_ACCOUNT / GCP_PROJECT not set; the golden eval was skipped."

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.present == 'true'
        with:
          python-version: "3.11"

      - uses: google-github-actions/auth@v3
        if: steps.creds.outputs.present == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install
        if: steps.creds.outputs.present == 'true'
        run: pip install -r backend/requirements.txt pytest  # golden.py reuses the banned-claim list from tests/

      - name: Run the golden eval against the live model
        if: steps.creds.outputs.present == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
          GOOGLE_API_KEY: unused
        run: |
          cd backend
          export TOKEN="$(gcloud auth print-access-token)"
          python evals/golden.py | tee eval.log
          echo "## Golden eval" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^== " eval.log >> "$GITHUB_STEP_SUMMARY"
