# Alert rules for chat.rayhanpatel.com and rayhanpatel.com (design: MONITORING PLAN, Oct 25 2026).
# Tool-agnostic definitions; monitoring/README.md has the click-path to create each one in
# Grafana Cloud. Two levels: "page" = phone push + email (the chat is broken or money is at
# risk), "email" = something is degrading. Every rule links its runbook.
#
# Metric names are as Grafana Cloud's OTLP gateway writes them from core/telemetry.py:
# dots become underscores, counters get _total, seconds get _seconds, attributes become
# labels (app.synthetic -> app_synthetic). Confirm each in Explore before saving a rule.

runbook_base: https://github.com/Rayhanpatel/AI-Resume-Agent/blob/main/docs/runbooks

rules:
  - name: Chat broken
    severity: page
    runbook: chat-broken.md
    source: Synthetic Monitoring per-check alert ("Failed executions"), on each of B1, A1, A2
    condition:
      B1 chat page: 2 failed executions in 30 minutes   # runs every 15 min
      A1 health: 3 failed executions in 15 minutes      # runs every 5 min from 2 locations
      A2 real answer: see "Real answer check failed / missing (A2)" below (GitHub Actions, every 6 h)
    note_periods: per-check alert periods must be one the API accepts (15m, 30m and 1h are used; 35m and 3h are refused)
    promql_alternative: |
      # failed executions per check over the window; fire at >= 2
      sum by (job) (increase(probe_all_success_count{job="B1 chat page"}[35m]))
        - sum by (job) (increase(probe_all_success_sum{job="B1 chat page"}[35m])) >= 2
    note: A1 also asserts database ok, so a database outage trips this rule as well as "Database down".

  - name: Spend
    severity: page
    runbook: spend.md
    source: Google Cloud Billing budget on project gen-lang-client-0814894727 (the source of truth for money)
    condition: actual spend passes 90% of the monthly budget (thresholds 50%, 90%, 100%)
    early_warning_promql: |
      # tokens in the last 24 h against the backend's own daily budget (500k since Oct 25); fire above 90%
      sum(increase(gen_ai_client_token_usage_sum[24h])) > 450000

  - name: Database down
    severity: email
    runbook: database-down.md
    promql: |
      max(chat_database_up) == 0
    pending_period: 1h
    note: the gauge refreshes with each real check (startup, and /health/llm at most every 10 min under A1).

  - name: Degrading answers
    severity: email
    runbook: degrading-answers.md
    promql: |
      # fallback model on more than 20% of answers in 6 h
      sum(increase(chat_model_fallbacks_total[6h]))
        / clamp_min(sum(increase(chat_answers_total{outcome="ok"}[6h])), 1) > 0.2
      # or, as a second rule: more than 2 apology or error answers in 24 h
      sum(increase(chat_answers_total{outcome=~"apology|error"}[24h])) > 2

  - name: Model retiring
    severity: email
    runbook: model-retiring.md
    source: GitHub Actions workflow .github/workflows/model-lifecycle.yml (weekly); GitHub emails on failure
    condition: a configured Gemini model has a scheduled retirement date within 60 days, or the judges'
      model is gone from OpenRouter or expires within 60 days

  - name: Slow
    severity: email
    runbook: slow.md
    promql: |
      # 95th percentile time to first word for real visitors over 24 h, against the 6 s goal
      histogram_quantile(0.95,
        sum by (le) (rate(chat_time_to_first_word_seconds_bucket{app_synthetic="false"}[24h]))) > 6
    pending_period: 1h
    note: with a few visitors a day this is coarse; A2's 15 s limit is the steady signal.

  # ── Added Oct 28, 2026 ───────────────────────────────────────────────

  - name: Lead not saved
    severity: email
    runbook: lead-not-saved.md
    promql: |
      # any recruiter lead the Google Sheet did not accept in the last hour
      sum(increase(chat_leads_total{outcome="error"}[1h])) > 0
    note: real visitors only (probe sessions never send a lead). The visitor's details are still in Supabase.

  - name: Decision model failing
    severity: email
    runbook: decision-model.md
    promql: |
      # Jev calls (app.purpose="decision") that ended in an error, over 6 h
      sum(increase(gen_ai_client_operation_duration_seconds_count{app_purpose="decision", error_type!=""}[6h])) > 2
    note: A2 also fails when no sentence carries a gate probability, which covers a silent "off".

  - name: Answer quality dropping
    severity: email
    runbook: answer-quality.md
    promql: |
      # more than 20% of stamped sentences unknown or carrying an unverified number over 24 h (real visitors)
      sum(increase(chat_verification_stamps_total{stamp=~"unknown|numbers_unverified|unverified", app_synthetic="false"}[24h]))
        / clamp_min(sum(increase(chat_verification_stamps_total{app_synthetic="false"}[24h])), 20) > 0.2
    note: the clamp keeps a single odd answer on a quiet day from firing it.

  - name: Retention job failing
    severity: email
    runbook: retention.md
    promql: |
      # the daily 90-day deletion failed, or has not run for 2 days
      sum(increase(chat_retention_runs_total{outcome="error"}[1d])) > 0
      # second rule:
      absent_over_time(chat_retention_runs_total{outcome="ok"}[2d])

  - name: Database growing
    severity: email
    runbook: database-growth.md
    promql: |
      # the free plan holds 500 MB; a chat row with history is a few kB
      max(chat_database_rows{db_collection_name="sessions"}) > 20000
        or max(chat_database_rows{db_collection_name="events"}) > 300000

  - name: Site, DNS, domain and certificate
    severity: email (certificate under 7 days: page)
    runbook: site-and-domain.md
    source: Synthetic Monitoring checks S1 (site + resume), D1 (DNS records), D2 (domain expiry) and the
      per-check TLS-expiry alert on every HTTP check
    condition:
      S1: 2 failed executions in 30 minutes (page, like "Chat broken")
      D1: 1 failed execution in 1 hour (hourly checks)
      D2: fewer than 45 days to the domain's expiry (the check fails), 1 failure in 1 hour
      TLS: fewer than 14 days (email), on A1, T1 and T2

  - name: Real answer check failed / missing (A2)
    severity: page
    runbook: chat-broken.md
    promql: |
      # failed: the last 6-hourly result was 0
      last_over_time(synthetic_check_success{check="A2 real answer", source=""}[7h]) < 1
      # missing (second rule, paused until GRAFANA_OTLP_HEADERS is set): no result for 13 h
      absent_over_time(synthetic_check_success{check="A2 real answer", source=""}[13h])
    note: the label is "check", not "job" (Grafana's OTLP gateway sets job from service.name). source="manual-test" values are excluded.

  - name: Golden eval regression
    severity: email
    runbook: degrading-answers.md
    promql: |
      last_over_time(eval_golden_passed{event!="pull_request"}[8d]) < last_over_time(eval_golden_cases{event!="pull_request"}[8d])

